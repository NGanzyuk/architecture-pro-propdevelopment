apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdenyprivileged
spec:
  crd:
    spec:
      names:
        kind: K8sDenyPrivileged
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      code:
        - engine: Rego
          source:
            version: "v1"
            rego: |
              package k8sdenyprivileged

              all_containers(pod) := array.concat(
                array.concat(
                  object.get(pod.spec, "containers", []),
                  object.get(pod.spec, "initContainers", [])
                ),
                object.get(pod.spec, "ephemeralContainers", [])
              )

              violation contains {"msg": msg} if {
                container := all_containers(input.review.object)[_]
                object.get(object.get(container, "securityContext", {}), "privileged", false) == true
                msg := sprintf("container %q must not set privileged=true", [container.name])
              }
